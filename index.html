<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>After School Lessons</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- linking CSS file-->
    <link rel="stylesheet" href="style.css">

    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@2.7.16/dist/vue.js"></script>
</head>
<body>

    <div id="app" class="container">
        <div>
            <h2>{{ sitename }}</h2>
            <button class="btn btn-primary" :disabled="cart.length === 0" @click="showCart = !showCart">Cart ({{ cart.length }})</button>
        </div>

        <div v-if="!showCart">
            <label>Sort by:</label>
            <select v-model="sortBy" v-on:change="sortLessons">
                <option value="subject">Subject</option>
                <option value="location">Location</option>
                <option value="price">Price</option>
                <option value="spaces">Spaces</option>
            </select>

            <select v-model="order" v-on:change="sortLessons">
                <option value="ascend">Ascending</option>
                <option value="descend">Descending</option>
            </select>

            <div class="row">
                <div class="column" v-for="lesson in lessons">
                    <div class="card">
                        <img :src="lesson.image">
                        <div class="card-body">
                            <h5><i :class="lesson.icon"></i> {{ lesson.subject }}</h5>
                            <p>Location: {{ lesson.location }}</p>
                            <p>Price: £{{ lesson.price }}</p>
                            <p>Spaces: {{ lesson.spaces }}</p>
                            <button class="btn btn-primary" :disabled="lesson.spaces === 0" @click="add(lesson)">Add to Cart</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div v-else>
            <h3>Shopping Cart</h3>
            <div class="row">
                <div class="column" v-for="lesson in cart">
                    <div class="card">
                        <img :src="lesson.image">
                        <div class="card-body">
                            <h5><i :class="lesson.icon"></i> {{ lesson.subject }}</h5>
                            <p>Location: {{ lesson.location }}</p>
                            <p>Price: £{{ lesson.price }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
